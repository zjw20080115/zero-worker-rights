<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权益知识 - 灵活就业人员权益助手</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/book.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           全局大矩形包裹层 (Mega Container)
           ============================================ */
        .mega-container {
            max-width: 1200px;
            margin: 30px auto 60px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px 30px 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            overflow: visible;
        }

        /* ============================================
           1. 顶部搜索与快捷入口
           ============================================ */
        .knowledge-hero {
            background: transparent;
            box-shadow: none;
            padding: 10px 0 30px 0; /* 稍微增加一点顶部留白 */
            position: relative;
        }

        /* ★ 核心修改：复刻图中的极简搜索栏 */
        .knowledge-hero .search-bar {
            max-width: 600px;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            /* 外层深灰色边框 */
            background: #f1f1f1;
            border: 1px solid #999;
            border-radius: 12px;
            padding: 4px; /* 给内部留出一圈深灰色的底 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* 内部的白色输入框 */
        .knowledge-hero .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc; /* 输入框自身的灰色细边 */
            border-radius: 8px; /* 内部圆角 */
            outline: none;
            font-size: 15px;
            color: #333;
            background: #ffffff;
            box-sizing: border-box;
        }
        .knowledge-hero .search-bar input::placeholder {
            color: #aaa;
            font-size: 15px;
        }

        /* 右侧极简图标按钮 */
        .knowledge-hero .search-bar .search-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            padding: 0 15px 0 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .knowledge-hero .search-bar .search-btn:hover {
            transform: scale(1.1);
        }
        .knowledge-hero .search-bar .search-btn svg {
            width: 22px;
            height: 22px;
        }

        /* ============================================
           2. 7个快捷卡片
           ============================================ */
        .quick-cards {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        .quick-cards .card {
            flex: 1;
            height: 115px;
            border-radius: 12px;
            padding: 12px 10px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            transition: all .3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
            box-sizing: border-box;
        }

        .quick-cards .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
            border-color: #D19C97;
        }

        .quick-cards .card .icon { font-size: 26px; margin-bottom: 8px; }
        .quick-cards .card .label { font-size: 14px; color: #334155; font-weight: 600; white-space: nowrap; }

        /* ============================================
           3. 下方主体布局
           ============================================ */
        .knowledge-main {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            border-top: 1px dashed rgba(0, 0, 0, 0.1);
            padding-top: 25px;
        }

        /* 左侧分类栏 */
        .sidebar-left { width: 250px; flex-shrink: 0; }
        .sidebar-left .category-list li {
            background: #ffffff;
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all .25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
        }
        .sidebar-left .category-list li:hover {
            transform: translateX(4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            border-color: #e5e7eb;
        }
        .sidebar-left .category-list li.active {
            background: #FCF9F2;
            border-color: #D19C97;
        }
        .sidebar-left .category-list li .folder-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
        }
        .sidebar-left .category-list li .cat-name { font-size: 15px; color: #1e293b; font-weight: 600; margin-bottom: 2px; }
        .sidebar-left .category-list li .cat-sub { font-size: 12px; color: #94a3b8; }

        /* 右侧内容区 */
        .content-right {
            flex: 1;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
            padding: 30px;
            min-height: 480px;
        }

        /* 文档列表 */
        .doc-list { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .doc-item {
            border-radius: 10px;
            padding: 18px 20px;
            border: 1px solid rgba(0,0,0,0.04);
            background: #fafafa;
            cursor: pointer;
            transition: all .25s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .doc-item:hover {
            background: #ffffff;
            transform: translateX(4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border-color: #D19C97;
        }
        .doc-item .doc-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #F5EEDC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: #C28840;
        }
        .doc-item .doc-body { flex: 1; min-width: 0; }
        .doc-item h3 { margin: 0 0 4px; font-size: 16px; color: #4A2F1D; font-weight: 700; }
        .doc-item .doc-meta { font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
        .doc-item .doc-meta .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            background: #F0E2E2;
            color: #8C3A3A;
            font-size: 12px;
            font-weight: 600;
        }
        .doc-item .doc-arrow { font-size: 18px; color: #cbd5e1; transition: all .25s; }
        .doc-item:hover .doc-arrow { transform: translateX(4px); color: #8C3A3A; }

        /* 详情页 */
        .detail-content {
            border-radius: 10px;
            padding: 24px;
            background: #fafafa;
            line-height: 2;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .book-back {
            border-radius: 8px;
            transition: all .25s;
            background: #F5EEDC;
            color: #4A2F1D;
            border: 1px solid #E3D5B9;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .book-back:hover { background: #E8DCC4; transform: translateX(-2px); }

        /* 响应式 */
        @media (max-width: 900px) {
            .quick-cards { flex-wrap: wrap; }
            .quick-cards .card { flex: 0 0 calc(33.33% - 12px); margin-bottom: 10px; }
            .knowledge-main { flex-direction: column; }
            .sidebar-left { width: 100%; }
            .content-right { width: 100%; padding: 20px; }
        }
        @media (max-width: 600px) {
            .quick-cards .card { flex: 0 0 calc(50% - 12px); }
            .mega-container { padding: 15px; margin: 15px auto 30px; }
        }
    </style>
</head>
<body>

<!-- ==================== 顶部 Banner ==================== -->
<div class="site-banner">
    <img src="../images/banner.png" alt="灵活就业人员权益助手" style="width: 100%; display: block; object-fit: cover; max-height: 400px;">
</div>

<!-- ==================== 导航栏 ==================== -->
<nav class="main-nav">
    <div class="main-nav-inner">
        <div class="main-nav-links">
            <a href="../index.html">首页</a>
            <a href="../test.html">权益自测</a>
            <a class="active" href="book.html">权益知识</a>
            <a href="community.html">互助墙</a>
            <a href="../profile.html">个人主页</a>
        </div>
        <div id="userArea"></div>
    </div>
</nav>

<!-- ==================== 大矩形包裹所有内容 ==================== -->
<div class="mega-container">

    <!-- 1. 顶部搜索与快捷入口 -->
    <section class="knowledge-hero">
        <div class="hero-content">
            <!-- ★ 极简搜索栏 -->
            <div class="search-bar">
                <input id="search-input" type="text" placeholder="搜索关键词，如：加班、工伤、合同…">
                <button class="search-btn" id="search-btn">
                    <!-- 纯 SVG 图标 -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <!-- 7个快捷卡片 -->
            <div class="quick-cards" id="quick-cards"></div>
        </div>
    </section>

    <!-- 2. 下方主体（左列表 + 右内容） -->
    <main class="knowledge-main">
        <aside class="sidebar-left">
            <ul class="category-list" id="category-list"></ul>
        </aside>

        <section class="content-right">
            <div id="welcome-view">
                <p style="color:#94a3b8;text-align:center;padding:80px 20px;font-size:15px;">
                    请从左侧选择分类，查看对应的权益知识文档。
                </p>
            </div>

            <div id="doc-view" class="hidden">
                <div class="breadcrumb">
                    <span>权益知识</span> &gt; <span id="doc-cat-title"></span>
                </div>
                <ul class="doc-list" id="doc-list"></ul>
            </div>

            <div id="detail-view" class="hidden">
                <div class="breadcrumb">
                    <span>权益知识</span> &gt; <span id="detail-cat-title"></span> &gt; <span id="detail-doc-title"></span>
                </div>

                <div class="article-header">
                    <h2 id="detail-title" style="color: #4A2F1D; font-family: 'ZCOOL XiaoWei', serif; margin-top: 15px;"></h2>
                    <span class="article-tag" id="detail-tag" style="background:#F0E2E2; color:#8C3A3A; padding:2px 8px; border-radius:4px; font-size:12px;">第 1 条</span>
                </div>

                <div id="detail-content" class="detail-content"></div>

                <button id="back-to-doc" class="btn book-back">← 返回列表</button>
            </div>

            <div id="search-view" class="hidden">
                <div class="breadcrumb">
                    <span>搜索结果</span> &gt; <span id="search-keyword-label"></span>
                </div>
                <ul class="doc-list" id="search-list"></ul>
            </div>
        </section>
    </main>

</div>

<!-- ==================== 登录注册弹窗 ==================== -->
<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <button class="auth-close" onclick="closeAuthModal()">×</button>
        <h2>账户登录</h2>
        <p class="auth-subtitle">登录后可以保存你的权益记录</p>
        <div class="auth-tabs">
            <button id="modalTabLogin" class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
            <button id="modalTabRegister" class="auth-tab" onclick="switchAuthTab('register')">注册</button>
        </div>
        <form id="modalLoginForm">
            <label>用户名</label>
            <input id="modalLoginUsername" type="text" placeholder="请输入用户名" required>
            <label>密码</label>
            <input id="modalLoginPassword" type="password" placeholder="请输入密码" required>
            <button type="submit" class="auth-submit">登录</button>
        </form>
        <form id="modalRegisterForm" class="hidden">
            <label>用户名</label>
            <input id="modalRegUsername" type="text" placeholder="请输入用户名" required>
            <label>昵称</label>
            <input id="modalRegNickname" type="text" placeholder="请输入昵称" required>
            <label>密码</label>
            <input id="modalRegPassword" type="password" placeholder="请输入密码" required>
            <button type="submit" class="auth-submit">注册</button>
        </form>
    </div>
</div>

<!-- ==================== 头像放大遮罩层 ==================== -->
<div id="avatar-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; cursor: zoom-out;">
    <img id="lightbox-img" src="" style="max-width: 80%; max-height: 80%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
</div>

<script src="../js/book.js"></script>
<script src="../js/auth_modal.js"></script>
<script src="../js/nav_avatar.js"></script>

</body>
</html>
