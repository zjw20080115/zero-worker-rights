<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 灵活就业人员权益助手</title>
    <!-- 全局样式 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 本模块专属样式 -->
    <link rel="stylesheet" href="css/profile.css">

    <style>
        /* ============================================
           整体布局：居中 + 两侧留白
           ============================================ */
        .profile-container {
            max-width: 1200px; /* 限制最大宽度 */
            margin: 30px auto 60px; /* 上下留白，左右居中 */
            padding: 0 20px; /* 小屏幕防贴边 */
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ============================================
           左侧卡片（个人信息）
           ============================================ */
        .profile-info-card {
            width: 300px;
            flex-shrink: 0;
            background: #ffffff !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
            border: 1px solid #f1f5f9 !important;
            padding: 30px 20px !important;
        }

        /* ============================================
           右侧卡片（我的帖子）
           ============================================ */
        .profile-main {
            flex: 1;
            min-width: 0;
        }

        .profile-panel {
            background: #ffffff !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
            border: 1px solid #f1f5f9 !important;
            padding: 30px !important;
            min-height: 450px;
        }

        .profile-panel h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 20px;
            color: #1769aa;
            font-weight: bold;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        /* ============================================
           ★ 弹窗美化样式（修改密码、修改用户名等）
           ============================================ */
        .mini-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .mini-modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        .mini-modal-box h4 {
            margin: 0 0 20px 0;
            color: #1769aa;
            font-size: 20px;
            font-weight: bold;
        }

        .mini-modal-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .mini-modal-box input:focus {
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.1);
        }

        .mini-modal-box .btn {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .mini-modal-box .btn:hover {
            background: #125789;
        }

        .mini-modal-box .mini-cancel {
            width: 100%;
            padding: 12px;
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
        }

        .mini-modal-box .mini-cancel:hover {
            background: #e2e8f0;
        }

        /* 响应式：小屏幕时上下堆叠 */
        @media (max-width: 900px) {
            .profile-container {
                flex-direction: column;
                align-items: center;
            }
            .profile-info-card {
                width: 100% !important;
            }
            .profile-main {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<!-- ==================== 1. 顶部 Banner ==================== -->
<div class="site-banner">
    <img src="images/banner.png" alt="灵活就业人员权益助手" style="width: 100%; display: block; object-fit: cover; max-height: 400px;">
</div>

<!-- ==================== 2. 导航栏 ==================== -->
<nav class="main-nav">
    <div class="main-nav-inner">
        <div class="main-nav-links">
            <a href="index.html">首页</a>
            <a href="test.html">权益自测</a>
            <a href="pages/book.html">权益知识</a>
            <a href="pages/community.html">互助墙</a>
            <a class="active" href="profile.html" aria-current="page">个人主页</a>
        </div>
        <div id="userArea"></div>
    </div>
</nav>

<!-- ==================== 主体：卡片仪表盘布局 ==================== -->
<main class="profile-container">
    <!-- 左侧卡片 -->
    <div class="profile-info-card">
        <div class="avatar-wrap" style="text-align: center; margin-bottom: 15px;">
            <img id="user-avatar" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='120'%3E%3Ccircle%20cx='60'%20cy='60'%20r='60'%20fill='%23cccccc'/%3E%3Ctext%20x='60'%20y='60'%20text-anchor='middle'%20dominant-baseline='central'%20font-size='48'%20fill='%23ffffff'%3E%E7%A9%BA%3C/text%3E%3C/svg%3E" alt="头像" title="点击修改头像" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #f1f5f9; cursor: pointer;">
        </div>
        <p class="greeting" style="text-align: center; color: #666; margin-bottom: 5px;">你好，欢迎回来 👋</p>
        <div id="user-name-display" title="点击修改用户名" style="text-align: center; font-size: 18px; font-weight: bold; color: #1769aa; margin-bottom: 20px; cursor: pointer;">当前用户名</div>

        <textarea id="suggestion-input" rows="5" placeholder="写下您的建议..." style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; font-family: inherit; resize: none; outline: none;"></textarea>

        <button id="suggestion-submit" class="btn" type="button" style="width: 100%; background: #1769aa; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; font-weight: bold;">提交建议</button>

        <button id="change-pwd-btn" class="btn" style="margin-bottom: 10px; width: 100%; background: #ffffff; color: #64748b; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; cursor: pointer;">修改密码</button>

        <button id="profile-auth-btn" class="profile-logout-btn" type="button" style="width: 100%; background: #ffffff; color: #ef4444; border: 1px solid #fca5a5; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">退出登录</button>
    </div>

    <!-- 右侧区块 -->
    <div class="profile-main">
        <div id="panel-posts" class="profile-panel">
            <h3>我的帖子</h3>
            <div id="my-posts-list" style="max-height: 500px; overflow-y: auto;"></div>
        </div>
    </div>
</main>

<!-- ==================== 各种弹窗 ==================== -->
<!-- 头像修改 -->
<div id="avatar-modal" class="mini-modal" style="display:none;">
    <div class="mini-modal-box">
        <h4>选择预设头像</h4>
        <div class="avatar-options">
            <img class="avatar-option" src="images/avatars/a1.jpg" alt="预设头像1">
            <img class="avatar-option" src="images/avatars/a2.jpg" alt="预设头像2">
            <img class="avatar-option" src="images/avatars/a3.jpg" alt="预设头像3">
            <img class="avatar-option" src="images/avatars/a4.jpg" alt="预设头像4">
            <img class="avatar-option" src="images/avatars/a5.jpg" alt="预设头像5">
            <img class="avatar-option" src="images/avatars/a6.jpg" alt="预设头像6">
            <img class="avatar-option" src="images/avatars/a7.jpg" alt="预设头像7">
            <img class="avatar-option" src="images/avatars/a8.jpg" alt="预设头像8">
        </div>
        <button id="avatar-cancel-btn" class="mini-cancel" type="button">取消</button>
    </div>
</div>

<!-- 修改用户名 -->
<div id="edit-username-modal" class="mini-modal" style="display:none;">
    <div class="mini-modal-box">
        <h4>修改用户名</h4>
        <input id="new-username" type="text" placeholder="请输入新用户名">
        <button id="edit-username-confirm" class="btn" type="button">确认修改</button>
        <button id="edit-username-cancel" class="mini-cancel" type="button">取消</button>
    </div>
</div>

<!-- 修改密码 -->
<div id="edit-password-modal" class="mini-modal" style="display:none;">
    <div class="mini-modal-box">
        <h4>修改密码</h4>
        <input type="password" id="old-password" placeholder="请输入原密码" required>
        <input id="new-password" type="password" placeholder="请输入新密码（至少 6 位）">
        <input id="confirm-password" type="password" placeholder="请再次输入新密码">
        <button id="edit-password-confirm" class="btn" type="button">确认修改</button>
        <button id="edit-password-cancel" class="mini-cancel" type="button">取消</button>
    </div>
</div>

<!-- 登录/注册弹窗 -->
<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <button class="auth-close" onclick="closeAuthModal()">×</button>
        <h2>账户登录</h2>
        <p class="auth-subtitle">登录后可以保存你的权益记录</p>
        <div class="auth-tabs">
            <button id="modalTabLogin" class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
            <button id="modalTabRegister" class="auth-tab" onclick="switchAuthTab('register')">注册</button>
        </div>
        <form id="modalLoginForm">
            <label>用户名</label>
            <input id="modalLoginUsername" type="text" placeholder="请输入用户名" required>
            <label>密码</label>
            <input id="modalLoginPassword" type="password" placeholder="请输入密码" required>
            <button type="submit" class="auth-submit">登录</button>
        </form>
        <form id="modalRegisterForm" class="hidden">
            <label>用户名</label>
            <input id="modalRegUsername" type="text" placeholder="请输入用户名" required>
            <label>昵称</label>
            <input id="modalRegNickname" type="text" placeholder="请输入昵称" required>
            <label>密码</label>
            <input id="modalRegPassword" type="password" placeholder="请输入密码" required>
            <button type="submit" class="auth-submit">注册</button>
        </form>
    </div>
</div>

<!-- 头像放大遮罩层 -->
<div id="avatar-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; cursor: zoom-out;">
    <img id="lightbox-img" src="" style="max-width: 80%; max-height: 80%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
</div>

<script src="js/auth_modal.js"></script>
<script src="js/nav_avatar.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
