<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的权益记录</title><link rel="stylesheet" href="../css/style.css"></head><body><header><div class="container header"><div><h1>新就业形态灵活就业人员权益助手</h1><p>了解权益，保护自己</p></div><nav><a href="../index.html">首页</a><a href="diagnose.html">我遇到问题</a><a href="knowledge.html">权益知识</a><a href="apply.html">申报助手</a><a class="active" href="cases.html">我的权益记录</a><a href="community.html">互助墙</a></nav></div></header><main class="container page"><h2>我的权益记录</h2><p>当前为浏览器本地演示版，后续可以接入登录和数据库。</p><div class="box"><h3>新建案件</h3><input id="name" placeholder="例如：2026年工资拖欠问题"><button class="btn" onclick="add()">保存案件</button></div><div id="list"></div></main><script>function render(){let a=JSON.parse(localStorage.getItem("rightsCases")||"[]");document.getElementById("list").innerHTML=a.length?a.map((x,i)=>`<div class="result"><h3>${x.name}</h3><p>状态：已创建，等待继续处理</p><p>创建时间：${x.time}</p><button class="btn" onclick="del(${i})">删除</button></div>`).join(""):'<div class="result"><p>暂时还没有案件。</p></div>'}function add(){let n=document.getElementById("name").value.trim();if(!n)return alert("请填写案件名称");let a=JSON.parse(localStorage.getItem("rightsCases")||"[]");a.push({name:n,time:new Date().toLocaleString("zh-CN")});localStorage.setItem("rightsCases",JSON.stringify(a));document.getElementById("name").value="";render()}function del(i){let a=JSON.parse(localStorage.getItem("rightsCases")||"[]");a.splice(i,1);localStorage.setItem("rightsCases",JSON.stringify(a));render()}render()</script></body></html>
