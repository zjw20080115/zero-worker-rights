<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权益自测 - 零工权益助手</title>
    <!-- 全局样式（队友A编写，勿修改） -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 本模块专属样式 -->
    <link rel="stylesheet" href="css/test.css">
</head>
<body>
    <!-- ==================== 顶部导航栏 ==================== -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="knowledge.html">权益知识</a></li>
                <li><a href="test.html" class="active" aria-current="page">权益自测</a></li>
                <li><a href="data.html">数据分析</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ==================== 区域一：说明区（intro） ==================== -->
        <section id="intro" class="intro">
            <h1>权益自测</h1>
            <p>
                本自测包含 8 道题目，帮助你快速了解自己作为零工劳动者
                可能面临的权益风险。测试结果仅供个人参考，不构成法律意见。
            </p>
            <button id="start-btn" class="btn" type="button">开始自测</button>
        </section>

        <!-- ==================== 区域二：答题区（quiz，初始隐藏） ==================== -->
        <section id="quiz" class="quiz hidden">
            <h2>请选择最符合你情况的一项</h2>
            <!-- 进度条文本：由 js/test.js 动态更新，初始为 0/8 -->
            <p id="progress">0/8</p>
            <!-- 答题表单：题目由 js/test.js 动态渲染，暂留空 -->
            <form id="quiz-form">
            </form>
            <button id="submit-btn" class="btn" type="submit" form="quiz-form">提交</button>
        </section>

        <!-- ==================== 区域三：结果区（result，初始隐藏） ==================== -->
        <section id="result" class="result hidden">
            <h2>你的权益情况</h2>
            <!-- 结果摘要区：由 js/test.js 填充 -->
            <div id="result-summary"></div>
            <!-- 结果列表区：由 js/test.js 填充 -->
            <ul id="result-list"></ul>
            <!-- 重新测试按钮 -->
            <button id="restart-btn" class="btn" type="button">重新测试</button>
            <!-- AI分析区：位于结果页底部 -->
            <div id="ai-section" class="box" style="margin-top: 25px; border-top: 2px dashed #ccd6e0; padding-top: 20px;">
            <h3>🤖 需要更深入的分析吗？</h3>
            <p style="font-size: 14px; color: #666;">描述你遇到的具体情况，AI 助手将为你提供初步诊断、材料清单和维权建议。</p >
            <textarea id="ai-input" placeholder="例如：我在外卖平台工作，最近一个月工资没发，也没有签合同..." rows="4" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccd6e0; border-radius: 8px; font-family: inherit; resize: vertical;"></textarea>
            <button id="ai-analyze-btn" class="btn" type="button">开始AI分析</button>
            <div id="ai-result" style="margin-top: 15px; background: #fdfdfd; border: 1px solid #edf0f4; padding: 15px; border-radius: 8px; display: none;"></div>
            </div>
        </section>
    </main>

    <!-- 本模块脚本：底部引入，保证 DOM 加载完成后执行 -->
    <script src="js/test.js"></script>
</body>
</html>
